<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Diva Jewels Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.supabase.co data:; media-src 'self' https://*.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://unpkg.com; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none';">
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-auth-screen">
  <div class="admin-auth-card">
    <div class="admin-auth-brand">
      <img src="../assets/logo.png" alt="Diva Jewels crest">
      <span class="word">Diva<small>Jewels — Admin</small></span>
    </div>
    <div class="admin-auth-eyebrow">Staff Access Only</div>
    <h1>Set New Password</h1>

    <div class="form-status" data-status></div>

    <form id="reset-form" novalidate>
      <div class="form-field">
        <label for="r-password">New Password</label>
        <input type="password" id="r-password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-field">
        <label for="r-confirm">Confirm Password</label>
        <input type="password" id="r-confirm" name="confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>

    <a class="admin-back-link" href="login.html">← Back to Admin Sign In</a>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-client.js"></script>
<script src="js/admin-reset-page.js"></script>
</body>
</html>
