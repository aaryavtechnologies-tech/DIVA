<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Diva Jewels</title>
<meta name="description" content="View your Diva Jewels order history and status.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com https://plus.unsplash.com https://*.supabase.co data:; media-src 'self' https://*.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://unpkg.com https://checkout.razorpay.com; connect-src 'self' https://*.supabase.co; frame-src https://api.razorpay.com https://checkout.razorpay.com; base-uri 'self'; form-action 'self'; object-src 'none';">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-badge"><img src="assets/logo.png" alt="Diva Jewels crest"></span>
      <span class="brand-word">Diva<small>Jewels</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="about.html">Our Story</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <div class="account-menu" data-account-menu>
        <button type="button" class="account-trigger" aria-label="Account" aria-expanded="false" data-account-trigger>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7.5" r="4"/></svg>
        </button>
        <div class="account-dropdown" data-account-dropdown></div>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="wrap">
    <span class="eyebrow">Your Account</span>
    <h1>My Orders</h1>
  </div>
</div>

<section>
  <div class="wrap">

    <div class="auth-checking" data-auth-checking>Checking your session…</div>

    <div class="hidden" data-orders-authgate>
      <div class="filter-row" data-orders-filter-row></div>
      <div class="orders-empty hidden" data-orders-empty>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        <h3>No orders yet</h3>
        <p>Once you place an order, it'll show up here.</p>
        <a href="products.html" class="btn btn-primary">Start Shopping</a>
      </div>
      <div class="orders-empty hidden" data-orders-filter-empty>
        <p>No orders match this filter.</p>
      </div>
      <div class="orders-list" data-orders-list></div>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom u-footer-flush">
      <span>© 2026 Diva Jewels. All rights reserved.</span>
      <div class="footer-bottom-right">
        <span>Payments secured &amp; encrypted at checkout</span>
        <a class="footer-admin-link" href="admin/login.html">Store Admin</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
