<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Diva Jewels</title>
<meta name="description" content="Sign in to your Diva Jewels account.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com https://plus.unsplash.com https://*.supabase.co data:; media-src 'self' https://*.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://unpkg.com https://checkout.razorpay.com https://static.cloudflareinsights.com; connect-src 'self' https://*.supabase.co https://cloudflareinsights.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; base-uri 'self'; form-action 'self'; object-src 'none';">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-badge"><img src="assets/logo.png" alt="Diva Jewels crest"></span>
      <span class="brand-word">Diva<small>Jewels</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="about.html">Our Story</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <div class="account-menu" data-account-menu>
        <button type="button" class="account-trigger" aria-label="Account" aria-expanded="false" data-account-trigger>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7.5" r="4"/></svg>
        </button>
        <div class="account-dropdown" data-account-dropdown></div>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="wrap">
    <span class="eyebrow">Welcome Back</span>
    <h1>Sign In</h1>
  </div>
</div>

<section>
  <div class="wrap auth-wrap">
    <div class="auth-card">
      <h3>Sign in to your account</h3>
      <div class="form-status"></div>
      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="l-email">Email</label>
          <input type="email" id="l-email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="l-password">Password</label>
          <input type="password" id="l-password" name="password" required minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="auth-divider">or</div>
      <button type="button" class="btn-google" data-google-btn>
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.2-2.36H12v4.47h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.74z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11C3.24 21.3 7.28 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29a7.24 7.24 0 0 1 0-4.58V6.6H1.26a12 12 0 0 0 0 10.8l4.01-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.28 0 3.24 2.7 1.26 6.6l4.01 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Continue with Google
      </button>
      <p class="auth-switch">New here? <a href="signup.html" data-signup-link>Create an account</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom u-footer-flush">
      <span>© 2026 Diva Jewels. All rights reserved.</span>
      <div class="footer-bottom-right">
        <span>Payments secured &amp; encrypted at checkout</span>
        <a class="footer-admin-link" href="admin/login.html">Store Admin</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
